<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>The Ninth Planet · Apollo ALSEP</title>
  <link rel="icon" href="assets/ui/favicon.svg" type="image/svg+xml" />
  <meta name="description" content="A lunar museum for every explorer: the stories of the ALSEP instruments that Apollo astronauts left on the Moon." />
  <link rel="stylesheet" href="styles/fonts.css" />
  <link rel="stylesheet" href="css/style.css" />

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <header id="app-header"></header>
  <div class="scroll-dark" id="scroll-dark" aria-hidden="true"></div>

  <main>
    <section class="hero" id="hero">
      <!-- layers, back to front: page background and stars (outside this section) -> APOLLO -> Moon -> shadow -> scroll fade -> text -->
      <img class="hero-apollo" src="assets/ui/apollo-steel.svg" alt="" aria-hidden="true" />
      <canvas id="hero-moon" aria-label="A slowly rotating 3D Moon with the Apollo landing sites marked"></canvas>
      <img class="hero-shadow" src="assets/scene/shadow-gradient.png" alt="" aria-hidden="true" />
      <div class="hero-fade" id="hero-fade" aria-hidden="true"></div>

      <div class="hero-copy">
        <p class="eyebrow" data-i18n="hero_tag"></p>
        <h1 class="display" data-i18n="hero_title"></h1>
        <p class="lead" data-i18n="hero_sub"></p>
      </div>

      <div class="hero-foot">
        <div class="cta">
          <a class="btn" href="exhibition.html" data-i18n="btn_enter"></a>
          <a class="btn ghost" href="moon-map.html" data-i18n="btn_map"></a>
          <a class="btn ghost" href="#origin" data-i18n="btn_origin"></a>
        </div>
        <p class="caption" data-i18n="hero_caption"></p>
        <div class="stats">
          <div class="stat" data-i18n="hero_stat1"></div>
          <div class="stat" data-i18n="hero_stat2"></div>
        </div>
      </div>
    </section>

    <section class="block origin reveal" id="origin" aria-labelledby="origin-title">
      <h2 class="title" id="origin-title"></h2>
      <div class="origin-grid">
        <div class="origin-text" id="origin-text"></div>
        <figure class="origin-fig">
          <img id="origin-img" alt="" loading="lazy">
          <figcaption id="origin-cap" class="small"></figcaption>
        </figure>
      </div>
    </section>

    <section class="block">
      <h2 class="title reveal" data-i18n="story_title"></h2>
      <p class="lead reveal" data-i18n="story_sub"></p>
      <div class="features" id="featured"></div>
    </section>
  </main>

  <footer id="app-footer"></footer>

  <script type="module" src="js/main.js"></script>
  <script type="module" src="js/hero.js"></script>
</body>
</html>
