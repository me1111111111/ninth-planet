<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Exhibition · The Ninth Planet</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Noto+Sans+Thai:wght@400;600;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="css/style.css" />

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
  <header id="app-header"></header>

  <main class="page">
    <section class="page-hero">
      <p class="eyebrow" data-i18n="ex_eyebrow"></p>
      <h1 class="display" data-i18n="ex_title"></h1>
      <p class="lead" data-i18n="ex_sub"></p>
    </section>

    <section class="block" style="padding-top:28px">
      <div class="toolbar">
        <input id="search" type="search" data-i18n-placeholder="ex_search" placeholder="Find an instrument…" aria-label="Search instruments" />
        <div class="chips" id="chips">
          <button class="chip active" data-cats="all" data-i18n="filter_all"></button>
          <button class="chip" data-cats="inside" data-i18n="filter_inside"></button>
          <button class="chip" data-cats="fields,particles" data-i18n="filter_fields"></button>
          <button class="chip" data-cats="support" data-i18n="filter_support"></button>
        </div>
      </div>
      <div class="grid" id="grid"></div>
    </section>
  </main>

  <!-- Exhibit viewer: photo gallery on the left, story on the right -->
  <dialog id="inspect" class="modal">
    <button class="close" data-close aria-label="Close">✕</button>
    <div class="modal-grid">
      <section class="gallery" aria-label="Photos">
        <div class="stage" id="stage">
          <img id="gimg" alt="" hidden />
          <div class="nophoto" id="nophoto" hidden data-i18n="photo_soon"></div>
          <button class="nav-btn prev" id="gprev" aria-label="Previous photo">‹</button>
          <button class="nav-btn next" id="gnext" aria-label="Next photo">›</button>
          <span class="counter" id="gcount"></span>
        </div>
        <p class="gcap" id="gcap"></p>
        <div class="strip" id="strip"></div>
        <p class="hint" data-i18n="gallery_hint"></p>
        <p class="credit" id="gcredit"></p>
      </section>
      <article class="story" id="story"></article>
    </div>
    <div class="modal-foot">
      <button class="pill" id="btn-read" data-i18n="read_aloud"></button>
      <button class="btn" id="btn-maps" data-i18n="btn_maps"></button>
    </div>
  </dialog>

  <!-- Maps: where it was built (Earth) and where it was left (Moon) -->
  <dialog id="mapdlg" class="modal">
    <button class="close" data-close aria-label="Close">✕</button>
    <div class="map-grid">
      <figure>
        <figcaption data-i18n="map_earth"></figcaption>
        <div id="earthmap"></div>
      </figure>
      <figure>
        <figcaption id="moon-caption"></figcaption>
        <canvas id="moonview" aria-label="The Moon with a pulsing marker at the landing site"></canvas>
      </figure>
    </div>
    <p class="caption" data-i18n="map_note"></p>
  </dialog>

  <footer id="app-footer"></footer>

  <script type="module" src="js/main.js"></script>
  <script type="module" src="js/exhibit.js"></script>
</body>
</html>
