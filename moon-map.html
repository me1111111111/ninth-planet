<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Moon map · The Ninth Planet</title>
  <link rel="icon" href="assets/ui/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles/fonts.css" />
  <link rel="stylesheet" href="css/style.css" />

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <header id="app-header"></header>

  <main class="page">
    <section class="page-hero">
      <p class="eyebrow" data-i18n="mm_eyebrow"></p>
      <h1 class="display" data-i18n="mm_title"></h1>
      <p class="lead" data-i18n="mm_intro"></p>
      <div class="chips" id="filters" style="margin-top:20px">
        <button class="chip active" data-group="all" aria-pressed="true" data-i18n="filter_all"></button>
        <button class="chip" data-group="inside" aria-pressed="false" data-i18n="filter_inside"></button>
        <button class="chip" data-group="fields" aria-pressed="false" data-i18n="mm_filter_fields"></button>
        <button class="chip" data-group="particles" aria-pressed="false" data-i18n="filter_particles"></button>
      </div>
    </section>

    <section class="block" style="padding-top:28px">
      <div class="mm-grid">
        <article class="mm-panel">
          <div class="mm-head">
            <strong data-i18n="mm_sites_head"></strong>
            <button class="pill" id="show-all" data-i18n="show_all"></button>
          </div>
          <div class="mm-stage" id="mm-stage">
            <div class="mm-ring" aria-hidden="true"></div>
            <div class="mm-ring r2" aria-hidden="true"></div>
            <canvas id="moon" aria-label="3D Moon with the five Apollo landing sites marked"></canvas>
            <div class="mm-labels" id="labels"></div>
          </div>
          <div class="mm-instruments">
            <h3 class="mm-sub" id="site-title"></h3>
            <div class="site-info" id="site-info"></div>
            <div class="site-photos" id="site-photos"></div>
            <div class="mm-chips" id="site-chips"></div>
          </div>
          <p class="caption" style="padding:0 20px 18px" data-i18n="mm_disclaimer"></p>
        </article>

        <aside class="mm-panel mm-dossier" id="dossier" aria-live="polite"></aside>
      </div>
    </section>

    <section class="block mm-below" style="padding-top:0">
      <article class="mm-panel mm-power" id="power"></article>
      <article class="mm-panel mm-findings" id="findings"></article>
    </section>
  </main>

  <dialog id="photo-dialog" class="modal photo-modal">
    <button class="close" data-close aria-label="Close photo"><img src="assets/ui/close.svg" alt="" width="18" height="18"></button>
    <figure class="photo-fig">
      <img id="photo-img" alt="">
      <figcaption id="photo-cap"></figcaption>
    </figure>
    <p class="caption photo-credit" id="photo-credit"></p>
  </dialog>

  <footer id="app-footer"></footer>

  <script type="module" src="js/main.js"></script>
  <script type="module" src="js/moonmap.js"></script>
</body>
</html>
